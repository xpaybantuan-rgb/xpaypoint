name: XPAYPOINT CTO Agent CI

on:
  pull_request:
    paths:
      - "cto-agent/**"
      - ".github/workflows/cto-agent-ci.yml"
  push:
    branches: ["main", "autopilot/**"]
    paths: ["cto-agent/**"]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cto-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
