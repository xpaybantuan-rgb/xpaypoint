name: Build XPAYPOINT Payment Listener APK

on:
  workflow_dispatch:
  push:
    paths:
      - "payment-listener/**"
      - ".github/workflows/build-payment-listener.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-listener
    env:
      XPAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      XPAYPOINT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      XPAYPOINT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$XPAYPOINT_KEYSTORE_PASSWORD" ] || [ -z "$XPAYPOINT_KEY_ALIAS" ] || [ -z "$XPAYPOINT_KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xpaypoint-release.jks"
          echo "XPAYPOINT_KEYSTORE_FILE=$RUNNER_TEMP/xpaypoint-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Prepare update APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/xpaypoint-payment-listener.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpaypoint-payment-listener-release
          path: payment-listener/app/build/outputs/apk/release/xpaypoint-payment-listener.apk
          if-no-files-found: error
      - name: Publish in-app update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: listener-v${{ github.run_number }}
          name: XPAYPOINT Listener v0.2.${{ github.run_number }}
          body: "Rilis otomatis XPAYPOINT Payment Listener. APK ditandatangani dengan kunci permanen XPAYPOINT."
          files: payment-listener/app/build/outputs/apk/release/xpaypoint-payment-listener.apk
          make_latest: true
