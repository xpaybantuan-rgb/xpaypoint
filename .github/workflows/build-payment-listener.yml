name: Build XPAYPOINT Payment Listener APK

on:
  workflow_dispatch:
  push:
    paths:
      - "payment-listener/**"
      - ".github/workflows/build-payment-listener.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xpaypoint-payment-listener-debug
          path: payment-listener/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
