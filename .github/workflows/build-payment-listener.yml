name: Build XPAYPOINT Payment Listener APK

on:
  workflow_dispatch:
  push:
    paths:
      - "payment-listener/**"
      - ".github/workflows/build-payment-listener.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-listener
    env:
      XPAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      XPAYPOINT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      XPAYPOINT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$XPAYPOINT_KEYSTORE_PASSWORD" ] && [ -n "$XPAYPOINT_KEY_ALIAS" ] && [ -n "$XPAYPOINT_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xpaypoint-release.jks"
            echo "XPAYPOINT_KEYSTORE_FILE=$RUNNER_TEMP/xpaypoint-release.jks" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; building a debug APK for device testing."
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon assembleRelease
      - name: Build debug APK
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK artifact
        run: |
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/xpaypoint-payment-listener.apk
            echo "APK_PATH=payment-listener/app/build/outputs/apk/release/xpaypoint-payment-listener.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=release" >> "$GITHUB_ENV"
          else
            mkdir -p app/build/outputs/apk/debug
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/xpaypoint-payment-listener-debug.apk
            echo "APK_PATH=payment-listener/app/build/outputs/apk/debug/xpaypoint-payment-listener-debug.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=debug" >> "$GITHUB_ENV"
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpaypoint-payment-listener-${{ steps.signing.outputs.ready == 'true' && 'release' || 'debug' }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
      - name: Publish signed release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: listener-v${{ github.run_number }}
          name: XPAYPOINT Listener v0.2.${{ github.run_number }}
          body: "Rilis otomatis XPAYPOINT Payment Listener."
          files: ${{ env.APK_PATH }}
          make_latest: true
