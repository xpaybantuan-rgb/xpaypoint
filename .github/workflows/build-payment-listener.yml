name: Build XPAYPOINT Payment Listener APK

on:
  workflow_dispatch:
  push:
    paths:
      - "payment-listener/**"
      - ".github/workflows/build-payment-listener.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare update APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/xpaypoint-payment-listener.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpaypoint-payment-listener-debug
          path: payment-listener/app/build/outputs/apk/debug/xpaypoint-payment-listener.apk
          if-no-files-found: error
      - name: Publish in-app update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: listener-v${{ github.run_number }}
          name: XPAYPOINT Listener v0.2.${{ github.run_number }}
          body: "Rilis otomatis XPAYPOINT Payment Listener."
          files: payment-listener/app/build/outputs/apk/debug/xpaypoint-payment-listener.apk
          make_latest: true
