    <!-- Tailwind Config Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: '#ff007f', /* Warna Pink XPAYPOINT */
                        dark: '#111111',

    <style>

            background: linear-gradient(180deg, #fce7f3 0%, #f3f4f6 15%, #f3f4f6 100%);
            background-attachment: fixed;
            color: #111111;
        }

        /* Hilangkan Scrollbar tapi tetap bisa di-scroll */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Transisi Sidebar */
        .sidebar { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        .sidebar.active { transform: translateX(0); }
        .sidebar-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        /* Transisi Modal (Auth) */
        .modal { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: translateY(20px); transition: transform 0.3s; }
        .modal.active .modal-content { transform: translateY(0); }

        /* Custom Input Outline */
        input:focus { outline: none; border-color: #ff007f; }
        
        /* Checkbox Custom */
        input[type="checkbox"]:checked { background-color: #ff007f; border-color: #ff007f; }
    </style>
</head>
